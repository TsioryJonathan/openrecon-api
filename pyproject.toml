[project]
name = "openrecon-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
