openapi: 3.1.0
info:
  title: OpenRecon API
  description: OSINT reconnaissance API. Modular, correlated, evidence-backed recon
    engine.
  version: 0.2.0
paths:
  /api/sherlock/sites:
    get:
      tags:
      - Sherlock
      summary: List all supported sites
      description: Returns the full list of platforms supported by sherlock, grouped
        by category. Use these names in the search endpoint.
      operationId: get_sites_api_sherlock_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitesResponse'
  /api/sherlock/search:
    post:
      tags:
      - Sherlock
      summary: Launch an OSINT search
      description: Runs a sherlock scan on the specified platforms. The username is
        checked on each site in the list. Results are saved to the database for later
        retrieval.
      operationId: search_username_api_sherlock_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Unsupported sites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sherlock/results:
    get:
      tags:
      - Sherlock
      summary: Retrieve search results
      description: Returns the history of all searches performed for a given username.
        Each search includes the list of results found.
      operationId: get_results_api_sherlock_results_get
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetResultsResponse'
                - $ref: '#/components/schemas/MessageResponse'
                title: Response Get Results Api Sherlock Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dork/generate:
    post:
      tags:
      - Dork
      summary: Generate Google dorks for a target
      description: Generates a list of Google dork queries for a given target (username,
        email, domain, or real name). Each dork includes a copy-paste query and a
        direct Google search URL.
      operationId: generate_api_dork_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DorkGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DorkGenerateResponse'
        '400':
          description: Empty target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/exif/extract:
    post:
      tags:
      - EXIF
      summary: Extract EXIF metadata from an image
      description: 'Uploads an image and returns its EXIF metadata: GPS coordinates,
        device make/model, capture date, editing software, and copyright.'
      operationId: extract_api_exif_extract_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extract_api_exif_extract_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExifResponse'
        '400':
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon:
    get:
      tags:
      - Recon
      summary: Recon an IP address or domain
      description: Accepts an IPv4/IPv6 address or a domain name. For an IP, returns
        geolocation, ISP, ASN, and proxy status. For a domain, returns registrar,
        creation/expiry dates, nameservers, DNS records, and subdomains.
      operationId: get_recon_api_recon_get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scan:
    post:
      tags:
      - Scan
      summary: Run an OpenRecon scan
      description: 'Runs the OpenRecon pipeline for a given target. Creates or reuses
        a Target, executes the appropriate module(s), normalizes and deduplicates
        all Findings, stores Evidence, and returns a structured result.


        **Supported target types:**

        - `username` — uses SherlockModule (480+ platforms)

        - `domain`   — uses DNSModule (DNS records + crt.sh subdomains)


        **Options:**

        - Username: `{"sites": ["GitHub", "Reddit"]}` to restrict platforms

        - Domain: no options currently needed'
      operationId: scan_api_scan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
        '400':
          description: Unsupported target type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations:
    post:
      tags:
      - Investigations
      summary: Create a new investigation
      operationId: create_investigation_api_investigations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Investigations
      summary: List investigations
      operationId: list_investigations_api_investigations_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}:
    get:
      tags:
      - Investigations
      summary: Get investigation summary
      operationId: get_investigation_api_investigations__investigation_id__get
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSummaryResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/targets:
    post:
      tags:
      - Investigations
      summary: Add a target to an investigation
      operationId: add_target_api_investigations__investigation_id__targets_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationAddTargetRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSummaryResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/targets/{target_id}/findings:
    get:
      tags:
      - Investigations
      summary: List findings for a target within an investigation
      operationId: get_target_findings_api_investigations__investigation_id__targets__target_id__findings_get
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      - name: target_id
        in: path
        required: true
        schema:
          type: string
          title: Target Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationTargetFindingsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/scan:
    post:
      tags:
      - Investigations
      summary: Run a scan within an investigation
      operationId: scan_within_investigation_api_investigations__investigation_id__scan_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationScanRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationScanResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/adaptive-scan:
    post:
      tags:
      - Investigations
      summary: Run an adaptive multi-hop scan within an investigation
      description: 'Run an adaptive recon scan starting from a single target.


        The engine scans the initial target, extracts new leads from the findings

        (domains, IPs, usernames found in profile URLs, etc.), and recursively

        scans those leads up to `max_depth` hops.


        Safety guarantees enforced by the engine:

        - **Depth limit**: never exceeds `max_depth` hops.

        - **Session dedup**: each (type, value) pair scanned at most once per run.

        - **Scope**: only targets within the investigation''s scope are scanned.

        - **Rate limit**: the process-wide rate limiter applies per (target, module).


        All discovered targets are automatically linked to the investigation.

        Returns a summary of all hops, findings, leads extracted/skipped.'
      operationId: adaptive_scan_within_investigation_api_investigations__investigation_id__adaptive_scan_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 4
          minimum: 0
          description: 'Maximum number of hops beyond the initial scan. 0 = scan only
            the initial target (same as /scan). Default: 2. Maximum: 4.'
          default: 2
          title: Max Depth
        description: 'Maximum number of hops beyond the initial scan. 0 = scan only
          the initial target (same as /scan). Default: 2. Maximum: 4.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationScanRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptiveScanResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/correlate:
    post:
      tags:
      - Investigations
      summary: Run correlation across all targets in an investigation
      operationId: correlate_investigation_api_investigations__investigation_id__correlate_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/relations:
    get:
      tags:
      - Investigations
      summary: List all relations for an investigation
      operationId: get_investigation_relations_api_investigations__investigation_id__relations_get
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationRelationsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/report:
    get:
      tags:
      - Investigations
      summary: Generate an investigation report
      operationId: get_report_api_investigations__investigation_id__report_get
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(json|markdown)$
          description: 'Output format: ''json'' or ''markdown''.'
          default: json
          title: Format
        description: 'Output format: ''json'' or ''markdown''.'
      responses:
        '200':
          description: Report in requested format
          content:
            application/json:
              schema: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/investigations/{investigation_id}/close:
    post:
      tags:
      - Investigations
      summary: Close an investigation
      operationId: close_investigation_api_investigations__investigation_id__close_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSummaryResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Health check
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    AdaptiveHopItem:
      properties:
        depth:
          type: integer
          title: Depth
        target_type:
          type: string
          title: Target Type
        target_value:
          type: string
          title: Target Value
        finding_count:
          type: integer
          title: Finding Count
        evidence_count:
          type: integer
          title: Evidence Count
        modules_run:
          items:
            type: string
          type: array
          title: Modules Run
        errors:
          items:
            type: string
          type: array
          title: Errors
        leads_extracted:
          items:
            $ref: '#/components/schemas/AdaptiveLeadItem'
          type: array
          title: Leads Extracted
        source_lead:
          anyOf:
          - $ref: '#/components/schemas/AdaptiveLeadItem'
          - type: 'null'
      type: object
      required:
      - depth
      - target_type
      - target_value
      - finding_count
      - evidence_count
      - modules_run
      title: AdaptiveHopItem
    AdaptiveLeadItem:
      properties:
        target_type:
          type: string
          title: Target Type
        target_value:
          type: string
          title: Target Value
        rule:
          type: string
          title: Rule
          description: Which extraction rule produced this lead.
        source_finding_id:
          type: string
          title: Source Finding Id
      type: object
      required:
      - target_type
      - target_value
      - rule
      - source_finding_id
      title: AdaptiveLeadItem
    AdaptiveScanResponse:
      properties:
        investigation_id:
          type: string
          title: Investigation Id
        max_depth:
          type: integer
          title: Max Depth
          description: Maximum hops configured for this run.
        hop_count:
          type: integer
          title: Hop Count
          description: Total number of hops executed.
        targets_scanned:
          items:
            $ref: '#/components/schemas/AdaptiveTargetItem'
          type: array
          title: Targets Scanned
          description: All (type, value) pairs scanned in this run.
        total_finding_count:
          type: integer
          title: Total Finding Count
        total_evidence_count:
          type: integer
          title: Total Evidence Count
        hops:
          items:
            $ref: '#/components/schemas/AdaptiveHopItem'
          type: array
          title: Hops
          description: Per-hop results, depth 0 first.
        leads_skipped:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Leads Skipped
          description: Leads not scanned (out of scope, deduped, unsupported type,
            depth exceeded).
        errors:
          items:
            type: string
          type: array
          title: Errors
        investigation:
          $ref: '#/components/schemas/InvestigationSummaryResponse'
      type: object
      required:
      - investigation_id
      - max_depth
      - hop_count
      - targets_scanned
      - total_finding_count
      - total_evidence_count
      - hops
      - investigation
      title: AdaptiveScanResponse
    AdaptiveTargetItem:
      properties:
        type:
          type: string
          title: Type
        value:
          type: string
          title: Value
      type: object
      required:
      - type
      - value
      title: AdaptiveTargetItem
    Body_extract_api_exif_extract_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_extract_api_exif_extract_post
    CategorySites:
      properties:
        name:
          type: string
          title: Name
        sites:
          items:
            type: string
          type: array
          title: Sites
      type: object
      required:
      - name
      - sites
      title: CategorySites
    CorrelationResponse:
      properties:
        investigation_id:
          type: string
          title: Investigation Id
        relations_created:
          type: integer
          title: Relations Created
        relations_skipped:
          type: integer
          title: Relations Skipped
        errors:
          items:
            type: string
          type: array
          title: Errors
        relations:
          items:
            $ref: '#/components/schemas/RelationItem'
          type: array
          title: Relations
      type: object
      required:
      - investigation_id
      - relations_created
      - relations_skipped
      title: CorrelationResponse
    DorkCategory:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        dorks:
          items:
            $ref: '#/components/schemas/DorkItem'
          type: array
          title: Dorks
      type: object
      required:
      - name
      - description
      - dorks
      title: DorkCategory
    DorkGenerateRequest:
      properties:
        target:
          type: string
          maxLength: 64
          minLength: 1
          title: Target
          examples:
          - john_doe
      type: object
      required:
      - target
      title: DorkGenerateRequest
    DorkGenerateResponse:
      properties:
        target:
          type: string
          title: Target
        total:
          type: integer
          title: Total
        categories:
          items:
            $ref: '#/components/schemas/DorkCategory'
          type: array
          title: Categories
      type: object
      required:
      - target
      - total
      - categories
      title: DorkGenerateResponse
    DorkItem:
      properties:
        title:
          type: string
          title: Title
        query:
          type: string
          title: Query
        url:
          type: string
          title: Url
      type: object
      required:
      - title
      - query
      - url
      title: DorkItem
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    ExifResponse:
      properties:
        filename:
          type: string
          title: Filename
        has_gps:
          type: boolean
          title: Has Gps
        gps:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Gps
        device:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Device
        lens:
          anyOf:
          - type: string
          - type: 'null'
          title: Lens
        camera_settings:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Camera Settings
        image:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Image
        flash:
          anyOf:
          - type: string
          - type: 'null'
          title: Flash
        white_balance:
          anyOf:
          - type: string
          - type: 'null'
          title: White Balance
        scene_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Scene Type
        datetime:
          anyOf:
          - type: string
          - type: 'null'
          title: Datetime
        software:
          anyOf:
          - type: string
          - type: 'null'
          title: Software
        artist:
          anyOf:
          - type: string
          - type: 'null'
          title: Artist
        copyright:
          anyOf:
          - type: string
          - type: 'null'
          title: Copyright
      type: object
      required:
      - filename
      - has_gps
      title: ExifResponse
    GetResultsResponse:
      properties:
