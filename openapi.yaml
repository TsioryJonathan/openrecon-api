openapi: 3.1.0
info:
  title: OpenRecon API
  description: OSINT reconnaissance API to find a user's presence across the web.
    Uses sherlock-project to scan 480+ platforms.
  version: 0.1.0
paths:
  /api/sherlock/sites:
    get:
      tags:
      - Sherlock
      summary: List all supported sites
      description: Returns the full list of platforms supported by sherlock, grouped
        by category. Use these names in the search endpoint.
      operationId: get_sites_api_sherlock_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitesResponse'
  /api/sherlock/search:
    post:
      tags:
      - Sherlock
      summary: Launch an OSINT search
      description: Runs a sherlock scan on the specified platforms. The username is
        checked on each site in the list. Results are saved to the database for later
        retrieval.
      operationId: search_username_api_sherlock_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid sites or limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sherlock/results:
    get:
      tags:
      - Sherlock
      summary: Retrieve search results
      description: Returns the history of all searches performed for a given username.
        Each search includes the list of results found.
      operationId: get_results_api_sherlock_results_get
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetResultsResponse'
                - $ref: '#/components/schemas/MessageResponse'
                title: Response Get Results Api Sherlock Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Health check
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    CategorySites:
      properties:
        name:
          type: string
          title: Name
          description: Category name
        sites:
          items:
            type: string
          type: array
          title: Sites
          description: List of site names in this category
      type: object
      required:
      - name
      - sites
      title: CategorySites
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    GetResultsResponse:
      properties:
        username:
          type: string
          title: Username
          description: Searched username
        searches:
          items:
            $ref: '#/components/schemas/SearchResultEntry'
          type: array
          title: Searches
          description: Search history
      type: object
      required:
      - username
      - searches
      title: GetResultsResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    ResultItem:
      properties:
        site:
          type: string
          title: Site
          description: Platform name
        url:
          type: string
          title: Url
          description: Profile URL found
      type: object
      required:
      - site
      - url
      title: ResultItem
    SearchRequest:
      properties:
        username:
          type: string
          title: Username
          description: Username to search for
          examples:
          - john_doe
        sites:
          items:
            type: string
          type: array
          maxItems: 50
          title: Sites
          description: List of platforms to scan (max 50). Use exact sherlock site
            names (e.g. GitHub, Twitter, Instagram).
          examples:
          - - GitHub
            - Twitter
            - Instagram
      type: object
      required:
      - username
      - sites
      title: SearchRequest
    SearchResponse:
      properties:
        username:
          type: string
          title: Username
          description: Searched username
        results:
          items:
            $ref: '#/components/schemas/ResultItem'
          type: array
          title: Results
          description: Found results
      type: object
      required:
      - username
      - results
      title: SearchResponse
    SearchResultEntry:
      properties:
        id:
          type: string
          title: Id
          description: Unique search ID
        created_at:
          type: string
          title: Created At
          description: Search timestamp
        results:
          items:
            $ref: '#/components/schemas/ResultItem'
          type: array
          title: Results
          description: Results from this search
      type: object
      required:
      - id
      - created_at
      - results
      title: SearchResultEntry
    SitesResponse:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/CategorySites'
          type: array
          title: Categories
          description: Sites grouped by category
        total:
          type: integer
          title: Total
          description: Total number of supported sites
      type: object
      required:
      - categories
      - total
      title: SitesResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
