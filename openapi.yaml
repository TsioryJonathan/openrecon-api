openapi: 3.1.0
info:
  title: OpenRecon API
  description: OSINT reconnaissance API to find a user's presence across the web.
    Uses sherlock-project to scan 480+ platforms.
  version: 0.1.0
paths:
  /api/sherlock/sites:
    get:
      tags:
      - Sherlock
      summary: List all supported sites
      description: Returns the full list of platforms supported by sherlock, grouped
        by category. Use these names in the search endpoint.
      operationId: get_sites_api_sherlock_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitesResponse'
  /api/sherlock/search:
    post:
      tags:
      - Sherlock
      summary: Launch an OSINT search
      description: Runs a sherlock scan on the specified platforms. The username is
        checked on each site in the list. Results are saved to the database for later
        retrieval.
      operationId: search_username_api_sherlock_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Unsupported sites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sherlock/results:
    get:
      tags:
      - Sherlock
      summary: Retrieve search results
      description: Returns the history of all searches performed for a given username.
        Each search includes the list of results found.
      operationId: get_results_api_sherlock_results_get
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetResultsResponse'
                - $ref: '#/components/schemas/MessageResponse'
                title: Response Get Results Api Sherlock Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dork/generate:
    post:
      tags:
      - Dork
      summary: Generate Google dorks for a target
      description: Generates a list of Google dork queries for a given target (username,
        email, domain, or real name). Each dork includes a copy-paste query and a
        direct Google search URL.
      operationId: generate_api_dork_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DorkGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DorkGenerateResponse'
        '400':
          description: Empty target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/exif/extract:
    post:
      tags:
      - EXIF
      summary: Extract EXIF metadata from an image
      description: 'Uploads an image and returns its EXIF metadata: GPS coordinates,
        device make/model, capture date, editing software, and copyright.'
      operationId: extract_api_exif_extract_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extract_api_exif_extract_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExifResponse'
        '400':
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon:
    get:
      tags:
      - Recon
      summary: Recon an IP address or domain
      description: Accepts an IPv4/IPv6 address or a domain name. For an IP, returns
        geolocation, ISP, ASN, and proxy status. For a domain, returns registrar,
        creation/expiry dates, nameservers, DNS records, and subdomains.
      operationId: get_recon_api_recon_get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Health check
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    Body_extract_api_exif_extract_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_extract_api_exif_extract_post
    CategorySites:
      properties:
        name:
          type: string
          title: Name
          description: Category name
        sites:
          items:
            type: string
          type: array
          title: Sites
          description: List of site names in this category
      type: object
      required:
      - name
      - sites
      title: CategorySites
    DorkCategory:
      properties:
        name:
          type: string
          title: Name
          description: Category name
        description:
          type: string
          title: Description
          description: What this category covers
        dorks:
          items:
            $ref: '#/components/schemas/DorkItem'
          type: array
          title: Dorks
          description: List of dorks in this category
      type: object
      required:
      - name
      - description
      - dorks
      title: DorkCategory
    DorkGenerateRequest:
      properties:
        target:
          type: string
          maxLength: 64
          minLength: 1
          title: Target
          description: Target to generate dorks for (username, email, domain, or name)
          examples:
          - john_doe
      type: object
      required:
      - target
      title: DorkGenerateRequest
    DorkGenerateResponse:
      properties:
        target:
          type: string
          title: Target
          description: The target that was used
        total:
          type: integer
          title: Total
          description: Total number of dorks generated
        categories:
          items:
            $ref: '#/components/schemas/DorkCategory'
          type: array
          title: Categories
          description: Dorks grouped by category
      type: object
      required:
      - target
      - total
      - categories
      title: DorkGenerateResponse
    DorkItem:
      properties:
        title:
          type: string
          title: Title
          description: Human-readable name for this dork
        query:
          type: string
          title: Query
          description: The Google dork query string
        url:
          type: string
          title: Url
          description: Direct Google search URL
      type: object
      required:
      - title
      - query
      - url
      title: DorkItem
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    ExifResponse:
      properties:
        filename:
          type: string
          title: Filename
          description: Original filename
        has_gps:
          type: boolean
          title: Has Gps
          description: Whether GPS coordinates were found
        gps:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Gps
          description: GPS data (lat, lon, altitude)
        device:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Device
          description: Device info (make, model)
        datetime:
          anyOf:
          - type: string
          - type: 'null'
          title: Datetime
          description: Original capture date/time
        software:
          anyOf:
          - type: string
          - type: 'null'
          title: Software
          description: Software used to process the image
        artist:
          anyOf:
          - type: string
          - type: 'null'
          title: Artist
          description: Artist/owner name
        copyright:
          anyOf:
          - type: string
          - type: 'null'
          title: Copyright
          description: Copyright information
      type: object
      required:
      - filename
      - has_gps
      title: ExifResponse
    GetResultsResponse:
      properties:
        username:
          type: string
          title: Username
          description: Searched username
        searches:
          items:
            $ref: '#/components/schemas/SearchResultEntry'
          type: array
          title: Searches
          description: Search history
      type: object
      required:
      - username
      - searches
      title: GetResultsResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    ReconResponse:
      properties:
        query:
          type: string
          title: Query
          description: Original query
        type:
          type: string
          title: Type
          description: 'Type of query: ''ip'' or ''domain'''
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Recon results
      type: object
      required:
      - query
      - type
      - data
      title: ReconResponse
    ResultItem:
      properties:
        site:
          type: string
          title: Site
          description: Platform name
        url:
          type: string
          title: Url
          description: Profile URL found
      type: object
      required:
      - site
      - url
      title: ResultItem
    SearchRequest:
      properties:
        username:
          type: string
          title: Username
          description: Username to search for
          examples:
          - john_doe
        sites:
          items:
            type: string
          type: array
          title: Sites
          description: List of platforms to scan. Use exact sherlock site names (e.g.
            GitHub, Twitter, Instagram).
          examples:
          - - GitHub
            - Twitter
            - Instagram
      type: object
      required:
      - username
      - sites
      title: SearchRequest
    SearchResponse:
      properties:
        username:
          type: string
          title: Username
          description: Searched username
        results:
          items:
            $ref: '#/components/schemas/ResultItem'
          type: array
          title: Results
          description: Found results
      type: object
      required:
      - username
      - results
      title: SearchResponse
    SearchResultEntry:
      properties:
        id:
          type: string
          title: Id
          description: Unique search ID
        created_at:
          type: string
          title: Created At
          description: Search timestamp
        results:
          items:
            $ref: '#/components/schemas/ResultItem'
          type: array
          title: Results
          description: Results from this search
      type: object
      required:
      - id
      - created_at
      - results
      title: SearchResultEntry
    SitesResponse:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/CategorySites'
          type: array
          title: Categories
          description: Sites grouped by category
        total:
          type: integer
          title: Total
          description: Total number of supported sites
      type: object
      required:
      - categories
      - total
      title: SitesResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
